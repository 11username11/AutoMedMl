services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: automedml_backend
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    environment:
      - PORT=8000
    depends_on:
      - server_gpu

  server_gpu:
    build:
      context: ./server-gpu
      dockerfile: Dockerfile
    container_name: automedml_gpu
    ports:
      - "8050:8050"
    volumes:
      - ./server-gpu:/app
    environment:
      - PORT=8050

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: automedml_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend